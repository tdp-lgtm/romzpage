name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Shown on the "CV PDFs out of date" notice (see the end of each job).
  CV_NOTICE_TITLE: CV PDFs on the website are out of date
  # GitHub users who get that notice by email (assigned + mentioned).
  CV_NOTICE_PEOPLE: tdp-lgtm romzeskens

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # to open the "CV PDFs out of date" notice
    outputs:
      cv_pdf: ${{ steps.cv_pdf.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Make assets available to Astro's public dir so they're served at /assets/*
      # Pages CMS writes images to the root assets/ folder; this bridges them for the build.
      - run: mkdir -p public && cp -r assets public/assets

      # Resize/recompress CMS-uploaded images so mobile isn't served 600 KB photos
      - run: node scripts/optimize-images.mjs

      - run: npm run build

      # Generate the CV PDFs from the built /cv pages so they always match the site.
      # First with Playwright's own Chromium; if that can't be installed or fails
      # (e.g. GitHub updated its build machines before Playwright supports them),
      # again with the Google Chrome that GitHub preinstalls on its machines.
      # If both fail, the site still deploys with the previous PDFs (next step)
      # and a notice is opened so it doesn't go unnoticed.
      - name: Generate CV PDFs
        id: cv_pdf
        continue-on-error: true
        timeout-minutes: 14  # a hang counts as a failure, so the site still deploys
        run: |
          if timeout -k 30s 5m npx playwright install --with-deps chromium \
             && timeout -k 20s 3m node scripts/generate-cv-pdf.mjs; then
            exit 0
          fi
          echo "::notice title=CV PDFs::Playwright's Chromium failed; retrying with the build machine's Google Chrome."
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          [ -n "$CHROME" ] || { echo "No Google Chrome on this build machine."; exit 1; }
          PW_CHROMIUM_PATH="$CHROME" timeout -k 20s 3m node scripts/generate-cv-pdf.mjs

      - name: Keep the previously published CV PDFs
        if: steps.cv_pdf.outcome == 'failure'
        run: |
          echo "::warning title=CV PDFs not regenerated::Generating the CV PDFs failed, so the site was deployed with the previously published PDFs. See the 'Generate CV PDFs' step."
          mkdir -p dist/assets
          missing=""
          for f in cv.pdf cv-short.pdf; do
            [ -s "dist/assets/$f" ] && continue  # made in this run before the failure
            if curl -fsSL --retry 3 "https://romyeskens.com/assets/$f" -o "$f.tmp" \
               && [ "$(head -c 4 "$f.tmp")" = "%PDF" ]; then
              mv "$f.tmp" "dist/assets/$f"
            else
              rm -f "$f.tmp"
              missing="$missing $f"
              echo "::warning::Could not fetch the previous $f either; its download link will be broken until the next successful build."
            fi
          done
          echo "CV_PDFS_MISSING=${missing# }" >> "$GITHUB_ENV"

      # Make stale PDFs visible: open one notice (assigned to CV_NOTICE_PEOPLE, so it
      # arrives by email). While it stays open, later runs only update its text,
      # which sends no further email. It is closed after the next deploy that
      # publishes fresh PDFs (end of the deploy job). Never blocks the deploy.
      - name: Report out-of-date CV PDFs
        if: steps.cv_pdf.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mentions=$(printf '@%s ' $CV_NOTICE_PEOPLE)
          if [ -n "$CV_PDFS_MISSING" ]; then
            state="Some CV download links are currently broken: $CV_PDFS_MISSING could not be regenerated and no previous copy was available."
          else
            state="The site is still serving the previous versions of cv.pdf and cv-short.pdf."
          fi
          body="${mentions}The website was updated, but the downloadable CV PDFs could not be regenerated. $state The CV page itself is up to date.

          Latest affected build: $RUN_URL (see the 'Generate CV PDFs' step)

          This notice closes itself after the next build that publishes fresh PDFs."
          # A failed lookup counts as "none open": a rare duplicate is harmless,
          # since the close step closes every open notice with this title.
          open=$(gh issue list --state open --limit 100 --json number,title \
                   --jq '.[] | select(.title == env.CV_NOTICE_TITLE) | .number') || open=""
          num=$(printf '%s\n' "$open" | head -n1)
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$body"
            exit 0
          fi
          assignees=$(printf '%s\n' $CV_NOTICE_PEOPLE | paste -sd, -)
          gh issue create --title "$CV_NOTICE_TITLE" --body "$body" --assignee "$assignees" \
            || gh issue create --title "$CV_NOTICE_TITLE" --body "$body"

      # CNAME must be in the dist root for GitHub Pages to respect the custom domain
      - run: cp CNAME dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      issues: write   # to close the "CV PDFs out of date" notice
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

      # Fresh PDFs are now live: close any open "out of date" notice.
      - name: Close the out-of-date notice
        if: needs.build.outputs.cv_pdf == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --limit 100 --json number,title \
                   --jq '.[] | select(.title == env.CV_NOTICE_TITLE) | .number')
          for num in $open; do
            gh issue close "$num" --comment "Fixed: fresh CV PDFs were published in $RUN_URL"
          done
