media:
  input: assets
  output: /assets

content:
  # ------------------------------------------------------------
  #  Site settings
  # ------------------------------------------------------------
  - name: site_settings
    label: Site Settings
    type: file
    path: data/site-settings.json
    format: json
    fields:
      - name: title
        label: Your name (header & footer)
        type: string
        description: Shown in the top-left and footer. Default — Romy Eskens.
      - name: description
        label: Default meta description
        type: text
        description: Used in search results and social link previews when no page-specific description applies (1–2 sentences, ~155 characters ideal).
      - name: og_image
        label: Social share image
        type: image
        options:
          path: assets
        description: Image shown when the site is shared on social media. Leave blank to use the portrait photo.
      - name: footer_text
        label: Footer name
        type: string
        description: Appears before the © year in the footer.
      - name: quick_links
        label: Front page quick links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        description: The small links shown under your portrait photo on the home page. Drag to reorder.
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: URL or email
            type: string
            required: true
            description: "Use a full URL (https://…) for external links, /cv for internal pages, or mailto:you@example.com for email."
      - name: analytics_id
        label: Umami analytics website ID
        type: string
        description: "Leave blank to disable analytics. Sign up free at umami.is, add your site, and paste the Website ID here (looks like: a1b2c3d4-…). No cookie banner needed."

  # ------------------------------------------------------------
  #  Appearance (theme)
  # ------------------------------------------------------------
  - name: theme
    label: Appearance
    type: file
    path: data/theme.json
    format: json
    fields:
      - name: color_scheme
        label: Colour scheme
        type: select
        options:
          values: [Graphite, Graphite Crimson, Offprint, Loeb, Delft, Porcelain, Oxford, Plain, Custom]
        default: Graphite
        description: "Preview every scheme with swatches and sample text at romyeskens.com/theme. Pick 'Custom' to use the six hex fields below instead."
      - name: color_paper
        label: "Custom: page background"
        type: string
        description: "Only used when Colour scheme is 'Custom'. Hex code, e.g. #F6F7F9. Tip: pick colours visually at htmlcolorcodes.com/color-picker."
      - name: color_ink
        label: "Custom: body text"
        type: string
        description: "Only used when Colour scheme is 'Custom'. Default: #111418"
      - name: color_fg2
        label: "Custom: secondary text"
        type: string
        description: "Only used when Colour scheme is 'Custom'. Venue names, co-authors, supporting text. Default: #434A55"
      - name: color_fg3
        label: "Custom: quiet text"
        type: string
        description: "Only used when Colour scheme is 'Custom'. Years and small notes; keep it at least 4.5:1 against the background. Default: #646B77"
      - name: color_rule
        label: "Custom: dividers"
        type: string
        description: "Only used when Colour scheme is 'Custom'. Thin lines between year groups and in the footer. Default: #DCE0E6"
      - name: color_accent
        label: "Custom: links & highlights"
        type: string
        description: "Only used when Colour scheme is 'Custom'. Hyperlink colour. Default: #111418 (ink); #A4162B for crimson"
      - name: font_display
        label: Headings
        type: select
        options:
          values: [Literata, Source Serif 4, Alegreya, Castoro, Castoro Titling, Vollkorn, EB Garamond, Libre Caslon Text, Spectral, Libre Baskerville, Georgia, Palatino]
        default: Literata
        description: Page titles, section heads and your name in the menu.
      - name: font_serif
        label: Text
        type: select
        options:
          values: [Literata, Source Serif 4, Alegreya, Castoro, Vollkorn, EB Garamond, Libre Caslon Text, Spectral, Libre Baskerville, Georgia, Palatino]
        default: Literata
        description: "See each font rendered in its own typeface at romyeskens.com/theme. Used for reading text, publication titles, and abstracts."
      - name: font_sans
        label: Labels (section heads, nav)
        type: select
        options:
          values: [Same as text, Alegreya SC, Vollkorn SC]
        default: Same as text
        description: "Leave as 'Same as text' unless you want small capitals. Small-caps fonts are set in lower case, so they show as true small capitals."
      - name: font_mono
        label: Figures (years, counts)
        type: select
        options:
          values: [Same as text, Ysabeau Office]
        default: Same as text
        description: "Used only for years, counts such as (×2) and amounts. Ysabeau Office is a quiet Garamond-shaped sans for figures."
      - name: link_underline
        label: Link underline style
        type: select
        options:
          values: [always, hover, none]
        default: always
        description: "Links in running text. always = always underlined (default); hover = underline on hover only; none = never. Preview at romyeskens.com/theme."
      - name: heading_weight
        label: Section heading weight
        type: select
        options:
          values: ["300", "400", "500", "600"]
        default: "500"
        description: "Weight of the section heads (Articles and Chapters, Lecturer, ...): Light (300), Regular (400), Medium (500, default) or Semibold (600). Literata has all four; other fonts may not. Preview at romyeskens.com/theme."

  # ------------------------------------------------------------
  #  Front page
  # ------------------------------------------------------------
  - name: front_page
    label: Front Page
    type: file
    path: data/front-page.json
    format: json
    fields:
      - name: portrait
        label: Portrait photo
        type: image
        options:
          path: assets
        description: Upload or replace the photo shown on the front page. Any shape works; it is cropped to a circle automatically.
      - name: portrait_focus
        label: "Photo focus (x% y%)"
        type: string
        default: "50% 40%"
        description: "The point of the photo that stays in view inside the circle, as horizontal% vertical%. 50% 50% is the centre; 50% 30% moves the crop up towards the face."
      - name: portrait_zoom
        label: Photo zoom
        type: number
        options:
          min: 1
          max: 1.8
          step: 0.05
        default: 1
        description: "1 shows the whole photo inside the circle; 1.3 zooms in by 30% around the focus point."
      - name: text
        label: About text
        type: rich-text
        options:
          format: html
          switcher: false
          media: false
        description: Use the toolbar for links, bold, italics, etc.
      - name: justify
        label: Justify text
        type: boolean
        default: true
        description: "Only on wide screens, with hyphenation. The Graphite design ignores it on the home page, whose text column is too narrow for justified text."

  # ------------------------------------------------------------
  #  Research (group)
  # ------------------------------------------------------------
  - name: research
    label: Research
    type: group
    items:
      - name: research_bio
        label: Research bio
        type: file
        path: data/research-bio.json
        format: json
        fields:
          - name: text
            label: Bio text
            type: rich-text
            options:
              format: html
              switcher: false
              media: false
          - name: justify
            label: Justify text
            type: boolean
            default: false

      - name: publications
        label: Publications
        type: file
        path: data/publications.json
        format: json
        fields:
          - name: items
            label: false
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: type
                label: Type
                type: select
                options:
                  values: [Article, Book, Chapter, Editor, Review, Public]
                default: Article
              - name: year
                label: Year
                type: string
                description: A number, "Forthcoming", "Online first", or "Commissioned".
              - name: journal
                label: Journal / Publisher / Venue
                type: string
              - name: volume
                label: Volume
                type: string
              - name: issue
                label: Issue
                type: string
              - name: pages
                label: Pages
                type: string
              - name: coauthors
                label: Co-authors
                type: string
              - name: abstract
                label: Abstract
                type: text
              - name: pdf
                label: PDF link
                type: string
              - name: doi
                label: Publisher / DOI link
                type: string
              - name: prize
                label: Prize / award
                type: string
              - name: published
                label: Published (show on site)
                type: boolean
                default: true
                description: Untick to hide this item without deleting it.
              - name: cv
                label: Show on CV
                type: boolean
                default: true

          - name: wip
            label: Work in progress
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: status
                label: Status
                type: select
                options:
                  values: [Under review, R&R, In preparation]
              - name: abstract
                label: Abstract
                type: text
              - name: pdf
                label: Draft PDF link
                type: string
              - name: published
                label: Published (show on site)
                type: boolean
                default: true
                description: Untick to hide this item without deleting it.
              - name: cv
                label: Show on CV
                type: boolean
                default: true

  # ------------------------------------------------------------
  #  Veni project — The Guilty Mind  (Research dropdown)
  # ------------------------------------------------------------
  - name: veni
    label: Veni Project — The Guilty Mind
    type: file
    path: data/veni.json
    format: json
    fields:
      - name: title
        label: Project title
        type: string
      - name: subtitle
        label: Funding programme
        type: string
      - name: duration
        label: Duration
        type: string
      - name: amount
        label: Grant amount
        type: string
      - name: description
        label: Project description
        type: rich-text
        options:
          format: html
          switcher: false
          media: false
      - name: news
        label: News items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: year
            label: Year
            type: string
          - name: date
            label: Full date
            type: string
          - name: outlet
            label: Outlet
            type: string
          - name: title
            label: Headline
            type: string
          - name: subtitle
            label: English subtitle (optional)
            type: string
          - name: url
            label: Link
            type: string

  # ------------------------------------------------------------
  #  Public Philosophy
  # ------------------------------------------------------------
  - name: public_philosophy
    label: Public Philosophy
    type: file
    path: data/public-philosophy.json
    format: json
    fields:
      - name: interviews
        label: Interviews
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: year
            label: Year
            type: string
          - name: date
            label: Full date
            type: string
          - name: outlet
            label: Outlet
            type: string
          - name: title
            label: Headline
            type: string
          - name: subtitle
            label: English subtitle (optional)
            type: string
          - name: url
            label: Link
            type: string
      - name: talks
        label: Public talks
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: year
            label: Year
            type: string
          - name: date
            label: Date
            type: string
          - name: title
            label: Title
            type: string
          - name: subtitle
            label: English subtitle (optional)
            type: string
          - name: venue
            label: Venue / event
            type: string
          - name: video
            label: Video link (optional)
            type: string
          - name: radio
            label: Radio link (optional)
            type: string
      - name: writing
        label: Writing
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: year
            label: Year
            type: string
          - name: date
            label: Date
            type: string
          - name: outlet
            label: Outlet
            type: string
          - name: title
            label: Title
            type: string
          - name: subtitle
            label: English subtitle (optional)
            type: string
          - name: url
            label: Link
            type: string

  # ------------------------------------------------------------
  #  Talks
  # ------------------------------------------------------------
  - name: talks
    label: Talks
    type: file
    path: data/talks.json
    format: json
    fields:
      - name: items
        label: One row per talk/event (no paper titles)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{venue}"
        fields:
          - name: year
            label: Year
            type: string
            description: 'A year, or "Scheduled" for upcoming talks.'
          - name: venue
            label: Event & location
            type: string
            required: true
            description: e.g. "LSE Moral and Political Philosophy Seminar".
          - name: type
            label: Type
            type: select
            options:
              values: [Invited, Peer-Review]
          - name: published
            label: Published (show on site)
            type: boolean
            default: true
            description: Untick to hide without deleting.
          - name: cv
            label: Show on CV
            type: boolean
            default: true

  # ------------------------------------------------------------
  #  Teaching
  # ------------------------------------------------------------
  - name: teaching
    label: Teaching
    type: file
    path: data/teaching.json
    format: json
    fields:
      - name: items
        label: false
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{institution}"
        fields:
          - name: institution
            label: Institution
            type: string
            required: true
          - name: entries
            label: Courses
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{course}"
            fields:
              - name: course
                label: Course
                type: string
              - name: role
                label: Role
                type: select
                options:
                  values: [Lecturer, Seminar Convenor, Teaching Assistant, Supervisor]
              - name: year
                label: Year
                type: string
              - name: levels
                label: Level of study
                type: select
                options:
                  values: [Undergraduate, Graduate]
                  multiple: true
              - name: note
                label: Note
                type: string

  # ------------------------------------------------------------
  #  CV (group: content + section order)
  # ------------------------------------------------------------
  - name: cv_group
    label: CV
    type: group
    items:
      - name: cv
        label: CV Content
        type: file
        path: data/cv.json
        format: json
        fields:
          - name: contact
            label: Contact (shown under your name)
            type: object
            fields:
              - name: website
                label: Website
                type: string
              - name: email
                label: Email
                type: string
              - name: address
                label: Address
                type: string

          - name: aos
            label: AOS (Areas of Specialisation)
            type: string
          - name: aoc
            label: AOC (Areas of Competence)
            type: string

          - name: employment
            label: Employment
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: year
                label: Year(s)
                type: string
              - name: title
                label: Position title
                type: string
              - name: institution
                label: Institution
                type: string

          - name: visits
            label: International visits
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{institution}"
            fields:
              - name: year
                label: Year(s)
                type: string
              - name: title
                label: Position (e.g. Visiting Fellow)
                type: string
              - name: institution
                label: Institution
                type: string
              - name: note
                label: Note (e.g. Sponsor)
                type: string

          - name: education
            label: Education
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{degree}"
            fields:
              - name: year
                label: Year(s)
                type: string
              - name: degree
                label: Degree
                type: string
              - name: institution
                label: Institution
                type: string
              - name: note
                label: Note (e.g. Distinction)
                type: string
              - name: thesis
                label: Thesis title
                type: string
              - name: supervisors
                label: Supervisors
                type: string
                description: Separate multiple names with commas — the label adjusts automatically.
              - name: examiners
                label: Examiners
                type: string

          - name: awards
            label: Funding and Awards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{description}"
            fields:
              - name: year
                label: Year
                type: string
              - name: description
                label: Description
                type: string
              - name: amount
                label: Monetary amount (optional)
                type: string
                description: Accepts symbols and text, e.g. "£4,000" or "€10,000".
              - name: major
                label: Major research grant?
                type: boolean
                default: false
                description: Tick to list under "Major research grants" (e.g. the Veni); untick for "Other funding and awards".

          - name: commentaries
            label: Invited commentaries
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: year
                label: Year
                type: string
              - name: title
                label: Author & work commented on
                type: string
              - name: institution
                label: Venue / event
                type: string

          - name: qualifications
            label: Qualifications & training
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: year
                label: Year
                type: string
              - name: title
                label: Qualification / workshop
                type: string
              - name: institution
                label: Institution / place
                type: string

          - name: events
            label: Event organising and service
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{event}"
            fields:
              - name: year
                label: Year
                type: string
              - name: event
                label: Event name
                type: string
              - name: role
                label: Role
                type: string
                description: "e.g. Organiser, Co-organiser, Reviewer, Chair."

          - name: service
            label: Professional service
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{description}"
            fields:
              - name: year
                label: Year(s)
                type: string
              - name: description
                label: Description
                type: string

          - name: reviewer
            label: Reviewer for journals
            type: text
            description: Comma-separated list of journals.

          - name: supervision
            label: Supervision (shown under Teaching)
            type: string
            list: true
            description: 'One line per category, e.g. "BA Philosophy theses (×12)".'

          - name: references
            label: References
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Name
                type: string
              - name: title
                label: Title / position
                type: string
              - name: institution
                label: Institution
                type: string
              - name: email
                label: Email
                type: string

          - name: custom_sections
            label: Custom sections
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            description: 'Extra CV categories of your own. After creating one, add its slot (custom-1, custom-2 or custom-3) to the CV Section Order list to make it appear.'
            fields:
              - name: slot
                label: Slot
                type: select
                options:
                  values: [custom-1, custom-2, custom-3]
                required: true
                description: Use a different slot for each custom section.
              - name: title
                label: Section heading
                type: string
                required: true
              - name: items
                label: Entries
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{detail}"
                fields:
                  - name: year
                    label: Year(s)
                    type: string
                  - name: detail
                    label: Main text
                    type: string
                  - name: sub
                    label: Sub-line (optional)
                    type: string
                  - name: link
                    label: Link (optional)
                    type: string

      - name: cv_order
        label: CV Section Order
        type: file
        path: data/cv-order.json
        format: json
        fields:
          - name: sections
            label: CV sections (drag to reorder, delete to remove)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{section}"
            fields:
              - name: section
                label: Section
                type: select
                options:
                  values:
                    - interests
                    - positions
                    - visits
                    - education
                    - publications
                    - wip
                    - presentations
                    - commentaries
                    - teaching
                    - qualifications
                    - awards
                    - events
                    - service
                    - references
                    - custom-1
                    - custom-2
                    - custom-3
              - name: hidden
                label: Hide this section
                type: boolean
                default: false
                description: Temporarily hide without removing it from the list.

  # ------------------------------------------------------------
  #  Navigation
  # ------------------------------------------------------------
  - name: nav
    label: Navigation
    type: file
    path: data/nav.json
    format: json
    fields:
      - name: items
        label: Nav items (drag to reorder)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Label
            type: string
          - name: href
            label: Link (leave blank for dropdown)
            type: string
          - name: subitems
            label: Dropdown items (optional)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Label
                type: string
              - name: href
                label: Page link
                type: string
