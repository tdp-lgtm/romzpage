media:
  input: assets
  output: /assets

content:
  - name: front_page
    label: Front Page
    type: file
    path: data/front-page.json
    format: json
    fields:
      - name: portrait
        label: Portrait photo
        type: image
        options:
          path: assets
      - name: text
        label: About text
        type: rich-text
        options:
          format: html
          switcher: false
          media: false
      - name: justify
        label: Justify text
        type: boolean
        default: true

  - name: research
    label: Research
    type: group
    items:
      - name: research_bio
        label: Research bio
        type: file
        path: data/research-bio.json
        format: json
        fields:
          - name: text
            label: Bio text
            type: rich-text
            options:
              format: html
              switcher: false
              media: false
          - name: justify
            label: Justify text
            type: boolean
            default: false

      - name: publications
        label: Publications
        type: file
        path: data/publications.json
        format: json
        fields:
          - name: items
            label: false
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: type
                label: Type
                type: select
                options:
                  values: [Article, Book, Chapter, Editor, Review, Public]
                default: Article
              - name: year
                label: Year
                type: string
              - name: journal
                label: Journal / Publisher / Venue
                type: string
              - name: volume
                label: Volume
                type: string
              - name: issue
                label: Issue
                type: string
              - name: pages
                label: Pages
                type: string
              - name: coauthors
                label: Co-authors
                type: string
              - name: abstract
                label: Abstract
                type: text
              - name: pdf
                label: PDF link
                type: string
              - name: doi
                label: Publisher / DOI link
                type: string
              - name: prize
                label: Prize / award
                type: string
              - name: published
                label: Published (show on site)
                type: boolean
                default: true
              - name: cv
                label: Show on CV
                type: boolean
                default: true
          - name: wip
            label: Work in progress
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: status
                label: Status
                type: select
                options:
                  values: [Under review, R&R, In preparation]
              - name: abstract
                label: Abstract
                type: text
              - name: pdf
                label: Draft PDF link
                type: string
              - name: published
                label: Published (show on site)
                type: boolean
                default: true
              - name: cv
                label: Show on CV
                type: boolean
                default: true

  - name: veni
    label: Veni Project — The Guilty Mind
    type: file
    path: data/veni.json
    format: json
    fields:
      - name: title
        label: Project title
        type: string
      - name: subtitle
        label: Funding programme
        type: string
      - name: duration
        label: Duration
        type: string
      - name: amount
        label: Grant amount
        type: string
      - name: description
        label: Project description
        type: rich-text
        options:
          format: html
          switcher: false
          media: false
      - name: news
        label: News items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: year
            label: Year
            type: string
          - name: date
            label: Full date
            type: string
          - name: outlet
            label: Outlet
            type: string
          - name: title
            label: Headline
            type: string
          - name: subtitle
            label: English subtitle (optional)
            type: string
          - name: url
            label: Link
            type: string

  - name: public_philosophy
    label: Public Philosophy
    type: file
    path: data/public-philosophy.json
    format: json
    fields:
      - name: interviews
        label: Interviews
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: year
            label: Year
            type: string
          - name: date
            label: Full date
            type: string
          - name: outlet
            label: Outlet
            type: string
          - name: title
            label: Headline
            type: string
          - name: subtitle
            label: English subtitle (optional)
            type: string
          - name: url
            label: Link
            type: string
      - name: talks
        label: Public talks
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: year
            label: Year
            type: string
          - name: date
            label: Date
            type: string
          - name: title
            label: Title
            type: string
          - name: subtitle
            label: English subtitle (optional)
            type: string
          - name: venue
            label: Venue / event
            type: string
          - name: video
            label: Video link (optional)
            type: string
          - name: radio
            label: Radio link (optional)
            type: string
      - name: writing
        label: Writing
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: year
            label: Year
            type: string
          - name: date
            label: Date
            type: string
          - name: outlet
            label: Outlet
            type: string
          - name: title
            label: Title
            type: string
          - name: subtitle
            label: English subtitle (optional)
            type: string
          - name: url
            label: Link
            type: string

  - name: talks
    label: Talks
    type: file
    path: data/talks.json
    format: json
    fields:
      - name: items
        label: false
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Paper title
            type: string
            required: true
          - name: published
            label: Published (show on site)
            type: boolean
            default: true
          - name: cv
            label: Show on CV
            type: boolean
            default: true
          - name: presentations
            label: Presentations
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{venue}"
            fields:
              - name: venue
                label: Venue / event
                type: string
              - name: type
                label: Type
                type: select
                options:
                  values: [Invited, Peer-Review]
              - name: year
                label: Year
                type: string
              - name: month
                label: Month
                type: string
              - name: institution
                label: Institution
                type: string
              - name: comment
                label: Comment
                type: string
              - name: published
                label: Published (show on site)
                type: boolean
                default: true

  - name: teaching_group
    label: Teaching
    type: group
    items:
      - name: teaching
        label: Teaching
        type: file
        path: data/teaching.json
        format: json
        fields:
          - name: items
            label: false
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{institution}"
            fields:
              - name: institution
                label: Institution
                type: string
                required: true
              - name: entries
                label: Courses
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{course}"
                fields:
                  - name: course
                    label: Course
                    type: string
                  - name: role
                    label: Role
                    type: select
                    options:
                      values: [Lecturer, Seminar Convenor, Teaching Assistant, Supervisor]
                  - name: year
                    label: Year
                    type: string
                  - name: levels
                    label: Level of study
                    type: select
                    options:
                      values: [Undergraduate, MA, MPhil, PhD]
                      multiple: true
                  - name: note
                    label: Note
                    type: string

  - name: cv_group
    label: CV
    type: group
    items:
      - name: cv
        label: CV Content
        type: file
        path: data/cv.json
        format: json
        fields:
          - name: contact
            label: Contact
            type: object
            fields:
              - name: website
                label: Website
                type: string
              - name: email
                label: Email
                type: string
              - name: address
                label: Address
                type: string
          - name: aos
            label: AOS
            type: string
          - name: aoc
            label: AOC
            type: string
          - name: employment
            label: Employment
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: year
                label: Year(s)
                type: string
              - name: title
                label: Position title
                type: string
              - name: institution
                label: Institution
                type: string
          - name: education
            label: Education
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{degree}"
            fields:
              - name: year
                label: Year(s)
                type: string
              - name: degree
                label: Degree
                type: string
              - name: institution
                label: Institution
                type: string
              - name: note
                label: Note
                type: string
              - name: thesis
                label: Thesis title
                type: string
              - name: supervisors
                label: Supervisors
                type: string
              - name: examiners
                label: Examiners
                type: string
          - name: awards
            label: Honours, grants & awards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{description}"
            fields:
              - name: year
                label: Year
                type: string
              - name: description
                label: Description
                type: string
              - name: amount
                label: Amount (optional)
                type: string
          - name: events
            label: Event organising
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: year
                label: Year
                type: string
              - name: title
                label: Event name
                type: string
              - name: institution
                label: Institution
                type: string
              - name: note
                label: Note
                type: string
          - name: service
            label: Professional service
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{description}"
            fields:
              - name: year
                label: Year(s)
                type: string
              - name: description
                label: Description
                type: string
          - name: reviewer
            label: Reviewer for journals
            type: text
          - name: references
            label: References
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Name
                type: string
              - name: title
                label: Title / position
                type: string
              - name: institution
                label: Institution
                type: string
              - name: email
                label: Email
                type: string

      - name: cv_order
        label: CV Section Order
        type: file
        path: data/cv-order.json
        format: json
        fields:
          - name: sections
            label: Drag rows to reorder CV sections
            type: object
            list:
              collapsible:
                collapsed: false
                summary: "{section}"
            fields:
              - name: section
                label: Section
                type: select
                options:
                  values:
                    - interests
                    - positions
                    - education
                    - publications
                    - wip
                    - presentations
                    - teaching
                    - awards
                    - events
                    - service
                    - references

  - name: nav
    label: Navigation
    type: file
    path: data/nav.json
    format: json
    fields:
      - name: items
        label: Nav items (drag to reorder)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Label
            type: string
          - name: href
            label: Link (leave blank for dropdown)
            type: string
          - name: subitems
            label: Dropdown items (optional)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Label
                type: string
              - name: href
                label: Page link
                type: string
